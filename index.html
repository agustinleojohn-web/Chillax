<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Chillax — Cinematic Movie Discovery</title>
    <meta
      name="description"
      content="Discover movies with Chillax. Explore trending films, top-rated titles, genres, movie details, and quality information in one cinematic catalog."
    />
    <meta name="theme-color" content="#141414" />

    <!-- Favicon & Web App Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Facebook / Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chillax" />
    <meta
      property="og:title"
      content="Chillax — Cinematic Movie Discovery"
    />
    <meta
      property="og:description"
      content="Stream the discovery. Find your next favorite movie. Explore a cinematic catalog with Chillax."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta
      property="og:image:alt"
      content="Chillax — cinematic movie discovery with its red play-button mascot."
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1650" />
    <meta property="og:image:height" content="900" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Chillax — Cinematic Movie Discovery"
    />
    <meta
      name="twitter:description"
      content="Find your next favorite movie. Discover trending films, top-rated titles, and more with Chillax."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Chillax cinematic movie discovery banner featuring its red play-button mascot."
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="bg-[#141414] text-[#FFFFFF] antialiased selection:bg-[#E50914]/40 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
